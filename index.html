<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Sissors</title>
</head>
<body>

    <div id="intro">Please select Rock, Paper, or Scissors choice: </div>
    <button value="Rock">Rock</button>
    <button value="Paper">Paper</button>
    <button value="Scissors">Scissors</button>

    <div id="pChoice"></div>
    <div id="cChoice"></div>
    <div id="Winner"></div>
    
    <div style="background-color: bisque; margin-top: 20px; width:220px">
    <div id="pScore"></div>
    <div id="cScore"></div>
    <div id="gameOver"></div>
    </div>    

    <script src="main.js"></script>
</body>
</html>
